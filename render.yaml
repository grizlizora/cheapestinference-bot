services:
  - type: web
    name: cheapestinference-bot
    env: docker
    plan: starter
    disk:
      name: bot-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: DB_PATH
        value: /app/data/bot.db
      - key: CF_WORKER_URL
        sync: false
      - key: CF_WORKER_SECRET
        sync: false
      - key: ALLOW_DIRECT_FALLBACK
        value: "true"
      - key: SCRAPE_MIN_INTERVAL_SEC
        value: "4"
      - key: SCRAPE_MAX_INTERVAL_SEC
        value: "6"
      - key: TOR_ENABLED
        value: "true"
      - key: PORT
        value: "10000"
